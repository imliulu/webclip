# WebClip server config
server:
  address: ":8080"
  serverRoot: "resource/public"
  clientMaxBodySize: 536870912   # 512MB，需 >= s3.maxFileSize，否则大文件会在框架层被拒（默认仅 8MB）
  dumpRouterMap: true
  logPath: "./data/logs"
  sessionPath: "./data/sessions"

database:
  default:
    type: "sqlite"
    name: "./data/webclip.db"
    debug: false

logger:
  level: "all"
  stdout: true

webclip:
  jwtSecret: "123456"
  tokenExpireHours: 2
  ttlDays: 1

s3:
  vendor: "cos"                                                   # cos=腾讯云COS, 留空或aws=AWS/MinIO
  endpoint: "https://cos.ap-shanghai.myqcloud.com"               # COS 填 https://cos.{region}.myqcloud.com，MinIO 填 http://minio:9000
  region: "ap-shanghai"
  bucket: "liulu-1305533294"
  accessKey: ""
  secretKey: ""
  pathStyle: false            # MinIO 需 true，COS/AWS 需 false
  publicUrl: "https://liulu-1305533294.cos.ap-shanghai.myqcloud.com"       # 可选，自定义下载域名（如 CDN）
  maxFileSize: 524288000  # 500MB
